[[mods]]
modId="dynamicelytra"
version="${version}"
displayName="Dynamic Elytra"
authors="falling_colud"
logoFile="assets/dynamicelytra/icon.png"
description='''
Speed you can see, two ways. DYNAMIC ELYTRA streams jet-style wingtip contrails off your elytra as you glide —
thin in a straight line, blooming into dense white vapor on a hard bank, driven by live airspeed and
turn-rate; optional trails fire on fast free-falls, riptide launches and other players' flights so a busy
sky fills with crisscrossing wakes. And in first person, anime-style SPEED LINES radiate from where you're
heading and bloom the faster you move, scaled per movement source (sprint, falling, vehicle, riptide,
elytra) — the former standalone Slipstream mod, now built in. Both effects are pure vanilla immediate-mode
geometry (no mixins), and everything is tunable in-game from Mods → Dynamic Elytra → Config.
'''

[[dependencies.dynamicelytra]]
modId="neoforge"
type="required"
versionRange="[21.1,)"
ordering="NONE"
side="CLIENT"

